# CapaFiscal + PostgreSQL. El esquema lo crean y actualizan las migraciones al arrancar.
# Para probar en local sin base de datos aparte, basta con DATABASE_URL=sqlite:///… (ver README).
#
#   docker compose up --build                       desarrollo (CapaFiscal en 127.0.0.1:8000)
#   docker compose --profile dev up --build         + Mailpit: buzón local, ningún correo sale (http://127.0.0.1:8025)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d   producción detrás de HTTPS (ver deploy/)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: capafiscal
      POSTGRES_USER: capafiscal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - capafiscal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capafiscal -d capafiscal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  capafiscal:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"  # solo este equipo; en producción entra por el proxy HTTPS
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      DATABASE_URL: postgresql+psycopg://capafiscal:${POSTGRES_PASSWORD}@db:5432/capafiscal
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - capafiscal-data:/data
    healthcheck:  # 503 si falla la base de datos, el esquema, el planificador o el disco
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Buzón SMTP local para desarrollo: guarda los correos y los enseña en una web; no entrega a nadie.
  # En .env: SMTP_HOST=mailpit, SMTP_PORT=1025 (CapaFiscal solo envía a buzones locales fuera de producción).
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  capafiscal-data:
  capafiscal-db:
